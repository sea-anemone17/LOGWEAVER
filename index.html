<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOGWEAVER</title><style>body{margin:0;background:#19171c;color:#eee;font:15px system-ui}header{padding:18px 24px;background:#29232d;display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:22px;color:#f2b4c6}button,.btn,input,select{background:#39313e;color:#fff;border:1px solid #665569;border-radius:8px;padding:9px;cursor:pointer}input[type=file]{display:none}main{display:grid;grid-template-columns:220px 1fr;min-height:85vh}aside{padding:18px;border-right:1px solid #4b3b4e}#tabs button{display:block;width:100%;text-align:left;margin:6px 0}.active{background:#80526d!important}section{padding:25px;max-width:920px;width:calc(100% - 50px);margin:auto}article{display:flex;gap:12px;border-bottom:1px solid #342c36;padding:13px 0}article img{width:42px;height:42px;object-fit:cover;border-radius:9px}article .avatar{width:42px;height:42px;background:#493e4b;border-radius:9px;flex-shrink:0}article .body{flex:1;min-width:0}article .name{font-weight:700}article .time{font-size:11px;color:#999;margin-left:8px}article .msg{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:5px;line-height:1.65}article[hidden]{display:none}#status{color:#bbb;font-size:12px}#search{width:180px}#more{margin:20px auto;display:block}@media(max-width:650px){main{grid-template-columns:1fr}aside{border:0;border-bottom:1px solid #555}#tabs{display:flex;overflow:auto;gap:6px}#tabs button{min-width:100px}section{padding:12px;width:calc(100% - 24px)}}</style><header><h1>✦ LOGWEAVER</h1><label class="btn">ZIP / HTML 불러오기<input id="file" type="file" accept=".zip,.html,.htm" multiple></label><input id="search" placeholder="이름 또는 대사 검색"><button id="export">HTML 로그북 출력</button><span id="status">파일을 불러와 주세요.</span></header><main><aside><h3>채팅 탭</h3><div id="tabs"></div></aside><section><h2 id="title">새 로그북</h2><p style="color:#aaa">메시지를 클릭하면 대사를 수정할 수 있습니다.</p><div id="messages"></div><button id="more" hidden>더 보기</button></section></main><script>
let records=[],avatars={},current='전체',limit=150,project='LOGWEAVER';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parse(source,channel){let doc=new DOMParser().parseFromString(source,'text/html');let list=[];let nodes=doc.querySelectorAll('p');for(let p of nodes){let cl=p.className||'';let name=p.querySelector('.name');let txt=p.querySelector('.text');if(!name||!txt)continue;let face=p.querySelector('img');let color=name.getAttribute('style')||'';let tm=p.querySelector('.date');let id=face?.getAttribute('src')||'';let speaker=name.textContent.trim();if(id)avatars[speaker]=id;list.push({speaker,text:txt.textContent.trim(),time:tm?.textContent.trim()||'',color:(color.match(/color:\s*([^;]+)/)||[])[1]||'#d9a9bd',icon:id,channel,hidden:false});}return list}
function setStatus(s){$('#status').textContent=s}
function tabs(){let a=['전체',...new Set(records.map(x=>x.channel))];$('#tabs').innerHTML=a.map(x=>'<button data-tab="'+esc(x)+'" class="'+(x===current?'active':'')+'">'+esc(x)+'</button>').join('');$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{current=b.dataset.tab;limit=150;tabs();render()})}
function subset(){let q=$('#search').value.toLowerCase();return records.filter(x=>!x.hidden&&(current==='전체'||x.channel===current)&&(!q||(x.text+' '+x.speaker).toLowerCase().includes(q)))}
function render(){let arr=subset(),show=arr.slice(0,limit);$('#messages').innerHTML=show.map(x=>{let i=records.indexOf(x);return '<article data-i="'+i+'">'+(x.icon?'<img src="'+esc(x.icon)+'">':'<div class="avatar"></div>')+'<div class="body"><div><span class="name" style="color:'+esc(x.color)+'">'+esc(x.speaker)+'</span><span class="time">'+esc(x.time)+'</span></div><div class="msg">'+esc(x.text)+'</div></div><button class="edit" title="수정">✎</button><button class="hide" title="숨김">×</button></article>'}).join('');$('#messages').querySelectorAll('article').forEach(el=>{let i=+el.dataset.i;el.querySelector('.edit').onclick=()=>{let v=prompt('대사 수정',records[i].text);if(v!==null){records[i].text=v;render()}};el.querySelector('.hide').onclick=()=>{records[i].hidden=true;render()}});$('#more').hidden=arr.length<=limit;setStatus(records.length.toLocaleString()+'개 메시지 · 표시 '+arr.length.toLocaleString()+'개')}
$('#more').onclick=()=>{limit+=150;render()};$('#search').oninput=()=>{limit=150;render()};
async function loadFile(f){let entries=[];if(/\.zip$/i.test(f.name)){if(!window.JSZip)throw Error('ZIP 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.');let zip=await JSZip.loadAsync(f);for(let [name,entry] of Object.entries(zip.files)){if(!entry.dir&&/\.html?$/i.test(name))entries.push({name,html:await entry.async('string')})}}else entries.push({name:f.name,html:await f.text()});if(!entries.length)throw Error('HTML 파일이 없습니다.');let parsed=entries.map(e=>({name:e.name,channel:e.name.split('/').pop().replace(/\.html?$/i,'').replace(/^.*?\[(.*?)\].*$/,'$1'),rows:parse(e.html,e.name.split('/').pop().replace(/\.html?$/i,''))}));let specific=parsed.filter(x=>!/すべて|전체|all/i.test(x.channel));if(specific.length)parsed=specific;for(let p of parsed)records.push(...p.rows);project=f.name.replace(/\.(zip|html?)$/i,'');$('#title').textContent=project;current='전체';limit=150;tabs();render()}
$('#file').onchange=async e=>{records=[];avatars={};setStatus('파일 분석 중…');try{for(let f of e.target.files)await loadFile(f);if(!records.length)setStatus('대사를 찾지 못했습니다. 다른 코코포리아 로그 형식일 수 있습니다.')}catch(err){setStatus('오류: '+err.message)}};
$('#export').onclick=()=>{let arr=subset();if(!arr.length)return alert('출력할 메시지가 없습니다.');let style=document.querySelector('style').textContent;let html='<!doctype html><html lang="ko"><meta charset="utf-8"><title>'+esc(project)+'</title><style>'+style+'</style><header><h1>'+esc(project)+'</h1></header><section>'+arr.map(x=>'<article>'+(x.icon?'<img src="'+esc(x.icon)+'">':'<div class="avatar"></div>')+'<div class="body"><span class="name" style="color:'+esc(x.color)+'">'+esc(x.speaker)+'</span><span class="time">'+esc(x.time)+'</span><div class="msg">'+esc(x.text)+'</div></div></article>').join('')+'</section></html>';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=project+'_logbook.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script></html>
